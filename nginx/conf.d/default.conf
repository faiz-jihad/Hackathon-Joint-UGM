# ==============================================================================
# RETIVA NGINX REVERSE PROXY CONFIGURATION (VPS Production Ready)
# ==============================================================================

upstream web_upstream {
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream minio_upstream {
    server minio:9000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum upload size for high-resolution fundus images
    client_max_body_size 50M;

    # Timeouts for deep learning AI inference
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ACME Challenge for Let's Encrypt SSL Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Public Fundus Images Media Proxy (MinIO S3 Bucket)
    location /storage/ {
        rewrite ^/storage/(.*) /retiva-fundus-images/$1 break;
        proxy_pass http://minio_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Main Application (Next.js Frontend & Backend APIs)
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for instant streaming/updates
        proxy_buffering off;
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
