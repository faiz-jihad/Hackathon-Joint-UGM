services:
  # ============================================================================
  # 1. POSTGRESQL RELATIONAL DATABASE (Permenkes 24/2022 RME & Audit Trails)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: retiva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retiva
      POSTGRES_PASSWORD: retivapassword
      POSTGRES_DB: retiva_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retiva -d retiva_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - retiva-network

  # ============================================================================
  # 2. MINIO S3-COMPATIBLE STORAGE (Zero-BLOB Architecture for Fundus Images)
  # ============================================================================
  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    container_name: retiva-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - retiva-network

  # ============================================================================
  # 2b. MINIO BUCKET INITIALIZER (Auto-provision 'retiva-fundus-images' bucket)
  # ============================================================================
  minio-create-buckets:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: retiva-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb --ignore-existing myminio/retiva-fundus-images;
      /usr/bin/mc anonymous set download myminio/retiva-fundus-images;
      echo '✅ MinIO bucket [retiva-fundus-images] initialized successfully!';
      exit 0;
      "
    networks:
      - retiva-network

  # ============================================================================
  # 3. FASTAPI AI SERVICE (Quality Gate, EfficientNet-B3, Grad-CAM Heatmap)
  # ============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: retiva-ai-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - HOST=0.0.0.0
      - MODEL_VERSION=efficientnet-b3-v1.0.0
      - QUALITY_THRESHOLD=0.80
      - RELIABILITY_THRESHOLD=0.85
      - INTERNAL_API_SECRET=retiva-internal-secret-token
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - retiva-network

  # ============================================================================
  # 4. NEXT.JS 14 CORE WEB API & CLINICAL PORTAL (Orchestrator & CDSS Rules)
  # ============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: retiva-web-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://retiva:retivapassword@postgres:5432/retiva_db?schema=public
      - JWT_SECRET=retiva-healthcare-jwt-secret-replace-in-production-min-32-chars
      - JWT_EXPIRES_IN=7d
      - STORAGE_PROVIDER=s3-compatible
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=retiva-fundus-images
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadminpassword
      - STORAGE_USE_SSL=false
      - AI_SERVICE_URL=http://ai-service:8003
      - AI_INTERNAL_SECRET=retiva-internal-secret-token
      - INTERNAL_API_SECRET=retiva-internal-secret-token
      - AI_SERVICE_SECRET=retiva-internal-secret-token
      - NODE_ENV=development
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-buckets:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - retiva-network

# ==============================================================================
# PERSISTENT STORAGE VOLUMES & ISOLATED NETWORK
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  retiva-network:
    driver: bridge
